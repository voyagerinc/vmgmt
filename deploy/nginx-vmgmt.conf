# Nginx site for vmgmt.voyage.co.in  ->  /etc/nginx/sites-available/vmgmt
# Start with this HTTP-only block, then run certbot (see DEPLOY.md) which rewrites
# it to add the HTTPS (443) server and the HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name vmgmt.voyage.co.in;

    # Agent .exe download (~21 MB) and evidence uploads need a larger body limit.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }
}
